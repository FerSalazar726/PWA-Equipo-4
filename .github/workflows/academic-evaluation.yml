name: Academic Evaluation Feedback
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.6'
          cache: npm
      - name: Instalación reproducible
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Pruebas unitarias
        run: npm run test:unit
      - name: Pruebas de integración
        run: npm run test:integration
      - name: Verificación completa (estructura, pruebas y build)
        run: npm run verify
      - name: Pruebas E2E contra el build de producción
        run: npm run test:e2e
      - name: Guardar evidencia técnica y documentos para revisión
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-evaluation-evidence
          if-no-files-found: warn
          path: reports/verification.json
